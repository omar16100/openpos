[package]
name = "openpos-bindings"
description = "The till facade as one WASM module. A thin translation layer over openpos-core, holding no rules of its own."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib for the browser, rlib so tests on this machine can link it natively.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
openpos-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
openpos-core = { path = "../core" }

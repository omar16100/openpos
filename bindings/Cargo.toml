[package]
name = "openpos-bindings"
description = "The till facade both front ends drive. A thin translation layer over openpos-core, holding no rules of its own."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib for the browser, rlib so tests on this machine can link it natively.
crate-type = ["cdylib", "rlib"]

# Every workspace lint, with one exception stated rather than inherited: the hex
# encoder indexes a sixteen byte table with a masked nibble, which is safer and
# faster than the arithmetic it replaces and cannot be written without an index.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
arithmetic_side_effects = "deny"
indexing_slicing = "allow"
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
openpos-core = { path = "../core" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Browser only. An Android library has no use for wasm glue, and before this was
# gated, an aarch64 build linked wasm-bindgen into the shared object a tablet
# would load.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.105"
wasm-bindgen = "0.2"
web-sys = { version = "0.3.105", features = ["FileSystemSyncAccessHandle", "FileSystemReadWriteOptions", "console"] }

[dev-dependencies]
openpos-core = { path = "../core" }

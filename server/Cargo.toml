[package]
name = "openpos-server"
description = "Sync hub and back office for openpos. Shares the core crate, so a synced sale is revalidated with the identical arithmetic the till used."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "openpos-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
openpos-core = { path = "../core" }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rand = "0.9"
sha2 = "0.10"
uuid = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
uuid = "1"
tower = { version = "0.5", features = ["util"] }

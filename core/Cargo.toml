[package]
name = "openpos-core"
description = "Everything openpos decides: money math, replica, storage, sync. Compiles to WASM, to an Android library, and into the server."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# std's HashMap implementation, usable from no_std. The replica is a hash-lookup
# workload and a BTreeMap would cost string comparisons on the scan path.
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }

[dev-dependencies]
proptest = "1"
